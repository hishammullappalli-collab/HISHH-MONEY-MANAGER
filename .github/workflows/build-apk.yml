
name: Build HISHH Money Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/hishh/moneymanager
          mkdir -p app/src/main/res/values
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/hishh/moneymanager/
          cp index.html app/src/main/assets/
          cp styles.xml app/src/main/res/values/
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "rootProject.name = 'HISHH-MONEY-MANAGER'" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.hishh.moneymanager'
            compileSdk 35
            defaultConfig {
              applicationId 'com.hishh.moneymanager'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HISHH-MONEY-MANAGER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
