
name: Build HISHH Money Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare app folder
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/hishh/moneymanager
          mkdir -p app/src/main/res/values
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/hishh/moneymanager/
          cp index.html app/src/main/assets/
          cp styles.xml app/src/main/res/values/
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.hishh.moneymanager'
            compileSdk 35
            defaultConfig {
              applicationId 'com.hishh.moneymanager'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0.0'
            }
          }
          GRADLE

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HISHH-MONEY-MANAGER-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
